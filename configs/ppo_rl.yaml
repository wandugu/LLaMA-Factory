model_name_or_path: /root/autodl-tmp/qwen-4b-maven-sft-merged
stage: ppo
datasets:
  - path: data/processed/rl_prompts.jsonl
output_dir: outputs/qwen-4b-rl
per_device_train_batch_size: 2
ppo_epochs: 4
learning_rate: 1.0e-6
kl_coef: 0.02
clip_range: 0.2
target_kl: 0.1
bf16: true
report_to: none
plugins:
  reward_callback: skirl_maxent
reward_args:
  reward_ckpt: outputs/qwen-4b-rm/reward.ckpt
  alpha: 0.6
  reward_clip: [-5.0, 5.0]
#wandb
report_to: wandb
run_name: maven_rl